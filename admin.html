<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>管理后台 | MORROW</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="admin-body">
    <header class="site-header" aria-label="主导航">
      <a class="brand" href="./index.html" aria-label="MORROW 首页">
        <span class="brand-mark">M</span>
        <span class="brand-word">MORROW</span>
      </a>
      <nav class="desktop-nav" aria-label="商店导航">
        <a href="./index.html#catalog">选购</a>
        <a href="./orders.html">订单查询</a>
        <a href="./admin.html" aria-current="page">管理后台</a>
      </nav>
      <div class="header-actions">
        <a class="icon-button" href="./index.html" aria-label="返回商城">
          <i data-lucide="store" aria-hidden="true"></i>
        </a>
      </div>
    </header>

    <main class="admin-shell">
      <section id="admin-login" class="admin-login" aria-labelledby="admin-login-title">
        <div class="login-card">
          <span class="login-mark">
            <i data-lucide="shield-check" aria-hidden="true"></i>
          </span>
          <p class="eyebrow">DEMO CONSOLE</p>
          <h1 id="admin-login-title">管理后台</h1>
          <p>演示管理密钥为 <strong>2026</strong>。后台可以调整价格、库存和订单状态，所有变更只保存在本地服务端。</p>
          <form data-admin-login>
            <label class="field">
              <span>管理密钥</span>
              <input
                type="password"
                name="code"
                inputmode="numeric"
                autocomplete="current-password"
                placeholder="输入 2026"
                required
              />
            </label>
            <button class="button button-primary button-block" type="submit">
              进入控制台
              <i data-lucide="arrow-right" aria-hidden="true"></i>
            </button>
          </form>
          <p class="login-note">这不是生产级鉴权，仅用于演示电子商务系统的管理端流程。</p>
        </div>
      </section>

      <section id="admin-console" class="admin-console" hidden>
        <div class="admin-heading">
          <div>
            <p class="eyebrow">OPERATIONS / 2026</p>
            <h1>商城控制台</h1>
            <p>管理商品价格、库存、上下架状态和订单履约状态。</p>
          </div>
          <div class="admin-heading-actions">
            <span class="demo-pill">演示管理后台</span>
            <button class="button button-secondary" type="button" data-admin-logout>
              退出
              <i data-lucide="log-out" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div id="admin-kpis" class="admin-kpis"></div>

        <div class="admin-tabs" role="tablist" aria-label="后台模块">
          <button class="is-active" type="button" role="tab" aria-selected="true" data-admin-tab="products">
            商品与库存
          </button>
          <button type="button" role="tab" aria-selected="false" data-admin-tab="orders">
            订单管理
          </button>
        </div>

        <section class="admin-panel" data-admin-panel="products">
          <div class="admin-panel-head">
            <div>
              <h2>商品与库存</h2>
              <p>修改后立即写入服务端状态文件，商城列表会读取新价格和库存。</p>
            </div>
            <label class="admin-search">
              <i data-lucide="search" aria-hidden="true"></i>
              <input type="search" data-admin-product-search placeholder="搜索商品或品牌" />
            </label>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>商品</th>
                  <th>分类</th>
                  <th>价格</th>
                  <th>库存</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="admin-product-rows"></tbody>
            </table>
          </div>
        </section>

        <section class="admin-panel" data-admin-panel="orders" hidden>
          <div class="admin-panel-head">
            <div>
              <h2>订单管理</h2>
              <p>更新演示订单的履约状态，订单查询页会同步显示。</p>
            </div>
            <button class="button button-danger" type="button" data-admin-reset>
              重置演示数据
              <i data-lucide="rotate-ccw" aria-hidden="true"></i>
            </button>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>订单</th>
                  <th>客户</th>
                  <th>商品</th>
                  <th>金额</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="admin-order-rows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <div id="admin-toast" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="./data/catalog.js"></script>
    <script src="./assets/vendor/lucide.min.js"></script>
    <script src="./admin.js" defer></script>
  </body>
</html>
